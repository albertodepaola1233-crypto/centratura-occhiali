<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Centratura Occhiali</title>

  <style>
    body {
      margin: 0;
      background: #f5f6f8;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .camera {
      position: relative;
      background: black;
      border-radius: 15px;
      overflow: hidden;
      margin-top: 20px;
    }

    video {
      display: block;
      width: 100%;
      transform: scaleX(-1);
    }

    #status {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #f3f4f6;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Centratura Occhiali</h1>

    <p>
      Questa pagina verrà utilizzata per la centratura
      automatica delle lenti.
    </p>

    <button onclick="avviaFotocamera()">
      Attiva fotocamera
    </button>

    <div class="camera">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

    </div>

    <div id="status">
      Fotocamera non ancora avviata.
    </div>

  </div>

</div>


<script>

async function avviaFotocamera() {

  const status =
    document.getElementById('status');

  try {

    status.textContent =
      'Richiesta accesso alla fotocamera...';

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    const video =
      document.getElementById('video');

    video.srcObject = stream;

    await video.play();

    status.innerHTML =
      '<strong>✓ Fotocamera funzionante!</strong><br>' +
      'La fotocamera è stata attivata correttamente.';

  }

  catch (errore) {

    console.error(errore);

    status.innerHTML =
      '<strong>Errore</strong><br><br>' +
      'Codice: ' +
      errore.name +
      '<br>' +
      'Messaggio: ' +
      errore.message;

  }

}

</script>

</body>
</html>
